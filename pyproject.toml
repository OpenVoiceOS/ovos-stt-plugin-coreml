[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-stt-plugin-coreml"
dynamic = ["version"]
description = "OVOS STT plugin that runs speech recognition on Apple devices with CoreML"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
keywords = ["apple", "coreml", "ovos", "plugin", "stt"]
# coremltools publishes cp37 to cp313 wheels and none for 3.14, so an install
# on 3.14 would try to build it from source. The floor is the one the ovos
# dependencies below already impose.
requires-python = ">=3.10,<3.14"
classifiers = [
    # no "License :: OSI Approved :: ..." row: PEP 639 supersedes the license
    # classifiers with the `license` expression above, and setuptools refuses
    # a build that carries both
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests",
    "ovos-plugin-manager>=2.1.1,<3.0.0",
    "ovos-utils>=0.8.4,<1.0.0",
    # both are imported at the top of ovos_stt_plugin_coreml/__init__.py, so
    # the package cannot be imported without them
    "coremltools>=7.1",
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-stt-plugin-coreml"

[project.entry-points."opm.stt"]
"ovos-stt-plugin-coreml" = "ovos_stt_plugin_coreml:CoremlSTT"

[tool.setuptools.dynamic]
version = {attr = "ovos_stt_plugin_coreml.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_stt_plugin_coreml*"]
