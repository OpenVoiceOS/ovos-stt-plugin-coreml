name: Run Build Tests

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      # coremltools, the dependency this plugin actually needs, publishes no
      # cp314 wheel: its newest release tags cp37 to cp313. The matrix stops
      # at 3.13 so it does not go green on a version the plugin cannot run.
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      # No test_path: this repository ships no test suite. `scripts/` holds
      # `test_inference.py` and `download_test_audio.py`, which are manual
      # tools. An empty test_path builds and installs the package and skips
      # pytest, which is what the old file did by hand.
