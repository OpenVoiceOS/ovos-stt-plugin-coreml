name: Run Build Tests

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      # coremltools, the dependency this plugin actually needs, publishes no
      # cp314 wheel: its newest release tags cp37 to cp313. The matrix stops
      # at 3.13 so it does not go green on a version the plugin cannot run.
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      # test/ holds the entry-point tests. They load the plugin from the
      # installed metadata, so a requirement the module imports but nothing
      # declares makes them fail. Building and installing the package alone
      # succeeds while the import fails, which is how the missing coremltools
      # and numpy stayed unseen.
      install_extras: 'test'
      test_path: 'test'
